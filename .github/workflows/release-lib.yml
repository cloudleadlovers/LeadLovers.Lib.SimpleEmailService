name: Release lib

on:
  push:
    tags: ['lib-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Upgrade npm (trusted publishing requires >=11.5.1)
        run: npm install -g npm@latest

      - name: Build lib
        run: cd apps/lib && bun run build

      - name: Unit tests
        run: cd apps/lib && bun test tests/unit

      - name: Sync apps/lib/package.json version from tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#lib-v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ] || [ -z "$VERSION" ]; then
            echo "ERROR: tag '$GITHUB_REF_NAME' does not start with 'lib-v'"
            exit 1
          fi
          cd apps/lib
          npm pkg set version="$VERSION"
          echo "Publishing @leadlovers/simple-email-service@$VERSION"

      - name: Publish to npm (OIDC trusted publisher)
        run: cd apps/lib && npm publish --access public --provenance
