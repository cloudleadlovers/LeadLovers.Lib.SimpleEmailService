name: Release lib

on:
  push:
    tags: ['lib-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - name: Build lib
        run: cd apps/lib && bun run build
      - name: Unit tests
        run: cd apps/lib && bun test tests/unit
      - name: Publish to npm
        run: cd apps/lib && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
