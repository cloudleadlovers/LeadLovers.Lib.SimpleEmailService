name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: Bun (typecheck + unit tests, all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Generate Prisma client (lib)
        run: cd apps/lib && bunx prisma generate
      - run: bun run typecheck
      - run: bun run test

  lib-node-smoke:
    name: Node ${{ matrix.node }} (build lib + smoke import)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Build lib
        run: cd apps/lib && bun run build
      - name: Smoke import on Node ${{ matrix.node }}
        run: |
          cd apps/lib
          node -e "import('./dist/index.js').then(m => { const keys = Object.keys(m); if (!keys.includes('email')) { console.error('missing email export'); process.exit(1); } console.log('Node ${{ matrix.node }} import OK:', keys); }).catch(e => { console.error(e); process.exit(1); })"
